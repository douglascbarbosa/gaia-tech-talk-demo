schema: spec-driven

context: |
  Tech stack: Laravel, Vue.js
  We use conventional commits
  Domain: Developer Portfolio Portal

rules:
  proposal:
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 1 hour
  implementation:
    - All PHP classes and named functions/methods must include PHPDoc (summary; @param, @return, and @throws where applicable). Follow .cursor/rules/php-phpdoc.mdc.

